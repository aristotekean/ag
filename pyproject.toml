[project]
name = "ag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "aristotekean", email = "kean.solano@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "deap>=1.4.4",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "scikit-learn>=1.9.1",
]

[project.scripts]
